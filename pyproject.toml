[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "can-ai-judge-evidence"
version = "0.5.0"
description = "Paired synthetic monitoring cases and a provenance-preserving evaluation harness"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.11", "jsonschema>=4.18"]

[project.scripts]
caje = "can_ai_judge_evidence.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
